name: Liquidation heat map data

# Pulls exact Kraken Futures + Crypto.com data every hour, computes liquidation
# levels, and saves them to the `liq-data` branch (main is never touched).
# GitHub delays or skips hourly cron runs on busy days, so each run also starts
# the next one at 9 past the next hour (the `next` job). The cron below is only a
# backup that restarts the chain if a run ever fails to hand off.
on:
  schedule:
    - cron: "9 * * * *"    # backup: every hour, 9 minutes past
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild all history from scratch"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write           # lets a run start the next one

concurrency:
  group: liq-heatmap
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Open the data branch
        run: |
          if git ls-remote --exit-code --heads origin liq-data >/dev/null; then
            git fetch --depth 1 origin liq-data
            git worktree add data FETCH_HEAD
            git -C data switch -C liq-data
          else
            git worktree add --orphan -b liq-data data
          fi

      - name: Collect
        env:
          LIQ_ALERT_PCT: ${{ vars.LIQ_ALERT_PCT }}   # optional, default 1.5 (% from a cluster)
        run: |
          python liqmap/collect.py --data data ${{ inputs.backfill && '--backfill' || '' }}
          rm -f data/sync_prepare.py

      - name: Save to liq-data (single rolling commit keeps the branch small)
        if: always()
        working-directory: data
        run: |
          git config user.name "liq-heatmap"
          git config user.email "liq-heatmap@users.noreply.github.com"
          git add -A
          git commit -q --amend -m "liquidation heat map data" 2>/dev/null || git commit -q -m "liquidation heat map data"
          git push -f origin liq-data

  next:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for 9 past the next hour, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          next=$(( now / 3600 * 3600 + 540 ))
          if [ "$next" -le $(( now + 60 )) ]; then next=$(( next + 3600 )); fi
          echo "Next run at $(date -u -d @$next +%H:%M) UTC"
          sleep $(( next - now ))
          gh workflow run liq-heatmap.yml --repo "$GITHUB_REPOSITORY" --ref main
